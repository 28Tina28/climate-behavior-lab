 <!DOCTYPE html>
 <html>
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1.0">
 <title>数据分析</title>
 <link rel="stylesheet" href="/static/css/style.css">
 <script src="/static/js/chart.umd.min.js"></script>
 <script src="/static/js/chartjs-adapter-date-fns.bundle.min.js"></script>
 </head>
 <body>
 <nav class="nav"><span class="nav-title">微气候观测</span><a href="/">概览</a><a href="/upload">上传</a><a href="/analysis" class="active">分析</a></nav>
 <div class="container">
 <h1 class="page-title">数据分析</h1>
 <div class="card"><div class="card-title">选择批次</div>
 <div class="filter-bar" id="batch-filters"></div>
 <div style="margin-top:8px">
 <button class="btn btn-outline" onclick="selectAll()">全选</button>
 <button class="btn btn-outline" onclick="clearAll()">清空</button>
 <button class="btn btn-primary" onclick="refreshAnalysis()">刷新</button>
 </div></div>
 <div class="grid-4" id="analysis-stats-row">
 <div class="stat-card"><div class="value" id="astat-temp">-</div><div class="label">温度</div></div>
 <div class="stat-card"><div class="value" id="astat-wbgt">-</div><div class="label">WBGT</div></div>
 <div class="stat-card"><div class="value" id="astat-behavior">-</div><div class="label">行为</div></div>
 <div class="stat-card"><div class="value" id="astat-stress">-</div><div class="label">热应力</div></div>
 </div>
 <div class="card"><div class="card-title">1 温度/WBGT时序</div><div class="chart-container"><canvas id="chart-timeseries"></canvas></div></div>
 <div class="grid-2">
 <div class="card"><div class="card-title">2 行为箱线图</div><div class="chart-container"><canvas id="chart-temp-behavior"></canvas></div></div>
 <div class="card"><div class="card-title">3 遮阴与温度</div><div class="chart-container"><canvas id="chart-shade"></canvas></div></div>
 </div>
 <div class="grid-2">
 <div class="card"><div class="card-title">4 行为-温度</div><div class="chart-container"><canvas id="chart-behavior-temp"></canvas></div></div>
 <div class="card"><div class="card-title">5 遮阴-年龄</div><div class="chart-container"><canvas id="chart-shade-age"></canvas></div></div>
 </div>
 </div>
 <div id="js-status" style="position:fixed;bottom:8px;right:8px;background:#1e293b;color:#fff;padding:4px 12px;border-radius:4px;font-size:11px;z-index:9999;"></div>
 <script src="/static/js/analysis_v2.js"></script>
 </body>
 </html>
