<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微气候观测数据分析平台</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/chart.umd.min.js"></script>
<script src="/static/js/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="/static/js/chartjs-plugin-annotation.min.js"></script>
</head>
<body>
<nav class="nav">
  <span class="nav-title">微气候观测 · 分析平台</span>
  <a href="/" class="active">概览</a>
  <a href="/upload">上传数据</a>
  <a href="/analysis">分析</a>
</nav>
<div class="container">
  <h1 class="page-title">观测概览</h1>
  <p class="page-subtitle">所有观测批次的总览与核心统计</p>
  <div class="grid-4" id="stats-row">
    <div class="stat-card"><div class="value" id="stat-total">-</div><div class="label">观测批次</div></div>
    <div class="stat-card"><div class="value" id="stat-climate">-</div><div class="label">气候数据点</div></div>
    <div class="stat-card"><div class="value" id="stat-behavior">-</div><div class="label">行为记录</div></div>
    <div class="stat-card"><div class="value" id="stat-wbgt">-</div><div class="label">平均 WBGT (℃)</div></div>
  </div>
  <div class="card">
    <div class="card-title">所有批次的 WBGT 对比</div>
    <div class="chart-container"><canvas id="chart-wbgt-overview"></canvas></div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-title">热应力等级分布</div>
      <div class="chart-container"><canvas id="chart-stress"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">行为类型分布</div>
      <div class="chart-container"><canvas id="chart-behavior-overview"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">观测记录</div>
    <table>
      <thead><tr><th>日期</th><th>时段</th><th>气候数据</th><th>行为记录</th><th>上传时间</th><th></th><th></th></tr></thead>
      <tbody id="batch-table-body"></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/main.js"></script>
</body>
</html>
